databases:
  - name: shelf153-db
    plan: free
    postgresMajorVersion: "17"

services:
  - type: web
    name: shelf153-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npx prisma migrate deploy && node server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: shelf153-db
          property: connectionString

      # Set these to your deployed Vercel URLs once you have them (see README).
      - key: FRONTEND_URL
        sync: false
      - key: DASHBOARD_URL
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: COOKIE_EXPIRES_IN
        value: "7"

      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_MAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"

      - key: CLOUDINARY_CLIENT_NAME
        sync: false
      - key: CLOUDINARY_CLIENT_API
        sync: false
      - key: CLOUDINARY_CLIENT_SECRET
        sync: false

      - key: PAWAPAY_BASE_URL
        sync: false
      - key: PAWAPAY_API_TOKEN
        sync: false
      - key: PAWAPAY_CURRENCY
        value: USD
      - key: PAWAPAY_ALLOWED_CURRENCIES
        value: USD,CDF
      - key: PAWAPAY_DEFAULT_PROVIDER
        value: AIRTEL_COD
      - key: PAWAPAY_ALLOWED_PROVIDERS
        value: AIRTEL_COD,VODACOM_MPESA_COD,ORANGE_COD
      - key: PAWAPAY_TIMEOUT_MS
        value: "15000"
      - key: PAYMENT_RECONCILIATION_AFTER_MINUTES
        value: "15"
      - key: PAYMENT_RECONCILIATION_INTERVAL_MS
        value: "60000"
      - key: PAYOUT_RECONCILIATION_AFTER_MINUTES
        value: "15"
      - key: REFUND_RECONCILIATION_AFTER_MINUTES
        value: "5"
      - key: PAWAPAY_RECONCILIATION_MAX_DELAY_MINUTES
        value: "360"
      - key: PAWAPAY_NOT_FOUND_CONFIRMATIONS
        value: "3"
      - key: PAWAPAY_RECONCILIATION_ALERT_AFTER_ATTEMPTS
        value: "5"
      - key: PAWAPAY_PAYOUT_CURRENCY
        value: USD
      - key: PAWAPAY_PAYOUT_ALLOWED_CURRENCIES
        value: USD,CDF
      - key: PAWAPAY_CDF_PER_USD
        sync: false
      - key: PAWAPAY_PAYOUT_ALLOWED_PROVIDERS
        value: AIRTEL_COD,VODACOM_MPESA_COD,ORANGE_COD
      - key: MIN_SELLER_PAYOUT_USD
        value: "0"
      - key: PAWAPAY_REQUIRE_SIGNED_CALLBACKS
        value: "false"
      - key: PAWAPAY_CALLBACK_PUBLIC_KEY
        sync: false
      - key: PAWAPAY_CALLBACK_KEY_ID
        sync: false
      - key: PAWAPAY_CALLBACK_AUTHORITY
        sync: false
      - key: PAWAPAY_SIGN_FINANCIAL_REQUESTS
        value: "false"
      - key: PAWAPAY_SIGNING_PRIVATE_KEY
        sync: false
      - key: PAWAPAY_SIGNING_KEY_ID
        sync: false

      - key: PRICE_INPUT_DIVISOR
        value: "283"
      - key: PLATFORM_COMMISSION_RATE
        value: "0.07"
