services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shelf153
      POSTGRES_USER: shelf153
      POSTGRES_PASSWORD: shelf153-local-only
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf153 -d shelf153"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://shelf153:shelf153-local-only@postgres:5432/shelf153?schema=public
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node server.js"]

volumes:
  postgres_data:
